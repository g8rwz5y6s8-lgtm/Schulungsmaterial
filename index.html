<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>LegalTegrity – E-Learning</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo-wrap">
      <img src="legaltegrity-logo.png" class="brand-logo" alt="LegalTegrity">
    </div>
    <div>
      <div class="title">LegalTegrity</div>
      <div class="subtitle">E-Learning (Uni-Projekt-Prototyp)</div>
    </div>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-title">Navigation</div>

    <!-- 🔥 NEU: Schulungsvideo -->
    <button class="nav-item active" data-view="video">
      🎬 Schulungsvideo
    </button>

    <div class="sidebar-divider">Module</div>

    <button class="nav-item" data-view="modul1">Modul 1 – Grundverständnis</button>
    <button class="nav-item" data-view="modul2">Modul 2 – Struktur</button>
    <button class="nav-item" data-view="modul3">Modul 3 – Pflege</button>
    <button class="nav-item" data-view="modul4">Modul 4 – Navigation</button>
    <button class="nav-item" data-view="modul5">Modul 5 – Governance</button>

    <button class="nav-item danger" id="resetBtn">Reset</button>
  </aside>

  <!-- MAIN -->
  <main class="content">

    <!-- 🎬 VIDEO VIEW -->
    <section class="view active" id="video">
      <h1>🎬 Einführungsvideo – Rechtskataster</h1>
      <p>
        Bitte sieh dir zuerst das Schulungsvideo vollständig an.  
        Danach kannst du mit den Modulen und Quizfragen starten.
      </p>

      <div class="video-box">
        <!-- Platzhalter – du kannst hier YouTube, Vimeo oder MP4 einbinden -->
        <iframe
          src="https://www.youtube.com/embed/dQw4w9WgXcQ"
          title="Schulungsvideo"
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>

      <button class="primary" id="videoDoneBtn">
        ✔ Video gesehen – zu den Modulen
      </button>
    </section>

    <!-- MODULE -->
    <section class="view" id="modul1"></section>
    <section class="view" id="modul2"></section>
    <section class="view" id="modul3"></section>
    <section class="view" id="modul4"></section>
    <section class="view" id="modul5"></section>

  </main>
</div>

<script src="app.js"></script>
</body>
</html>
